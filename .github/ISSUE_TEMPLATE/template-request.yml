name: Template request
description: Ask for a workflow template for your kind of business.
labels: [template]
body:
  - type: input
    id: industry
    attributes:
      label: Industry
      placeholder: Veterinary clinic
    validations:
      required: true
  - type: textarea
    id: calls
    attributes:
      label: What calls should it handle?
      description: The common reasons people call, and what should happen for each.
    validations:
      required: true
