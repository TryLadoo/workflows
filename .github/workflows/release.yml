# Publishes to npm when a GitHub Release is published, using npm trusted
# publishing (OIDC) with provenance. It fails harmlessly until the package is
# set up on npm with this repo and workflow as a trusted publisher.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run validate && npm test
      - run: npm publish --provenance --access public
